name: euro-office
services:
  euro-office:
    image: ghcr.io/junkerderprovinz/euro-office:latest@sha256:da17922afedf759d3554abefa57adaf6a9375aaf8684a94e02c454d63efde2fb
    container_name: euro-office
    restart: unless-stopped
    ports:
      - 9900:80
      - 9943:443
    volumes:
      - /DATA/AppData/$AppID/data:/var/www/euro-office/Data
      - /DATA/AppData/$AppID/certs:/certs:ro
    environment:
      JWT_SECRET: casaos
      WOPI_ENABLED: 'true'
      JWT_ENABLED: 'true'
      USE_UNAUTHORIZED_STORAGE: 'true'
      ONLYOFFICE_HTTPS_HSTS_ENABLED: 'true'
x-casaos:
  id: com.junkerderprovinz.euro-office
  main: euro-office
  index: /
  port_map: '9900'
  scheme: http
  title:
    en_US: Euro-Office
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.euro-office/assets/icon.png
  version: 1.2.1

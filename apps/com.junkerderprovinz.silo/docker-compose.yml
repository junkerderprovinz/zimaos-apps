name: silo
services:
  silo:
    image: pgsty/silo:latest
    container_name: silo
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /DATA/AppData/$AppID/data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: casaos1234
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: Silo
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/silo/icon.png
      homepage.description: S3 object store with a web console
      glance.name: Silo
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/silo/icon.png
      glance.description: S3 object store with a web console
    command: server /data --console-address ":9001"
x-casaos:
  id: com.junkerderprovinz.silo
  main: silo
  index: /
  port_map: '9001'
  scheme: http
  title:
    en_US: Silo
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.silo/assets/icon.png
  version: 2026.11.12

name: silo
services:
  silo:
    image: pgsty/silo:latest@sha256:6bf9ef957d8a2e6c0bf096b4d990132377688ff9f75e2e0a85d73e5e55836906
    container_name: silo
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /DATA/AppData/$AppID/data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: casaos1234
    command: server /data --console-address ":9001"
x-casaos:
  id: com.junkerderprovinz.silo
  main: silo
  index: /
  port_map: '9001'
  scheme: http
  title:
    en_US: Silo
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.silo/assets/icon.png
  version: 2026.10.26

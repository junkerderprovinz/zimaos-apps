name: rustdesk
services:
  rustdesk:
    image: junkerderprovinz/rustdesk:latest
    container_name: rustdesk
    restart: unless-stopped
    ports:
      - 21114:21114
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21117:21117
      - 21118:21118
      - 21119:21119
    volumes:
      - /DATA/AppData/$AppID:/data
      - /DATA/AppData/$AppID/api:/app/data
    environment:
      RELAY: ''
      RUSTDESK_API_RUSTDESK_ID_SERVER: ''
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ''
      RUSTDESK_API_RUSTDESK_API_SERVER: ''
      ENCRYPTED_ONLY: '1'
      MUST_LOGIN: N
      RUSTDESK_API_LANG: en
      TZ: $TZ
x-casaos:
  id: com.junkerderprovinz.rustdesk
  main: rustdesk
  index: /_admin/
  port_map: '21114'
  scheme: http
  title:
    en_US: RustDesk
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.rustdesk/assets/icon.png
  version: 1.0.2

name: vectorcraft
services:
  vectorcraft:
    image: junkerderprovinz/vectorcraft:latest@sha256:58fa3b94c17681d075095453540c2ff509d981fc12f872060295960e4384ee6d
    container_name: vectorcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32161:3001
      - 32160:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: VectorCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/vectorcraft/icon.png
      homepage.description: Vector illustration with SVG and PDF
      glance.name: VectorCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/vectorcraft/icon.png
      glance.description: Vector illustration with SVG and PDF
x-casaos:
  id: com.junkerderprovinz.vectorcraft
  main: vectorcraft
  index: /
  port_map: '32161'
  scheme: https
  title:
    en_US: VectorCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.vectorcraft/assets/icon.png
  version: 1.1.2

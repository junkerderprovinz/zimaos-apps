name: vectorcraft
services:
  vectorcraft:
    image: junkerderprovinz/vectorcraft:latest@sha256:d7abd7206af52f6ad481f48cefa0189d7feddfc9a04feecad6367d87c0f53165
    container_name: vectorcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32161:3001
      - 32160:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.vectorcraft
  main: vectorcraft
  index: /
  port_map: '32161'
  scheme: https
  title:
    en_US: VectorCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.vectorcraft/assets/icon.png
  version: 1.1.2

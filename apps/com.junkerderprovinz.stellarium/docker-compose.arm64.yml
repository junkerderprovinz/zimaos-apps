name: stellarium
services:
  stellarium:
    image: junkerderprovinz/stellarium:latest@sha256:54d7aae9868659ec288b3250c841fe857c36f9c98dce3f223cfda95bede707f1
    container_name: stellarium
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32151:3001
      - 32150:3000
    volumes:
      - /DATA/AppData/$AppID:/config
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.stellarium
  main: stellarium
  index: /
  port_map: '32151'
  scheme: https
  title:
    en_US: Stellarium
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.stellarium/assets/icon.png
  version: 1.2.2

name: knightloader
services:
  knightloader:
    image: junkerderprovinz/knightloader:latest@sha256:198262be0ba9888f634b0b57102ee1716ee0acc7d3e17f577d70f133d15284fe
    container_name: knightloader
    restart: unless-stopped
    ports:
      - 8749:8749
    volumes:
      - /DATA/AppData/$AppID:/data
      - /DATA/Downloads:/data/downloads
      - /DATA/AppData/$AppID/user:/mnt/user
    environment:
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.knightloader
  main: knightloader
  index: /
  port_map: '8749'
  scheme: http
  title:
    en_US: KnightLoader
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.knightloader/assets/icon.png
  version: 2.4.0

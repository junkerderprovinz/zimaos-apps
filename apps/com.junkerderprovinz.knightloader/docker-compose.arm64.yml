name: knightloader
services:
  knightloader:
    image: junkerderprovinz/knightloader:latest@sha256:00186124aef04723d1201724f99905178e586b7af2c799b33567da31c0aa9a6b
    container_name: knightloader
    restart: unless-stopped
    ports:
      - 8749:8749
    volumes:
      - /DATA/AppData/$AppID:/data
      - /DATA/Downloads:/data/downloads
      - /DATA/AppData/$AppID/user:/mnt/user
    environment:
      UMASK: '022'
x-casaos:

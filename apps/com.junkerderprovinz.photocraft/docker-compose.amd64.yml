name: photocraft
services:
  photocraft:
    image: junkerderprovinz/photocraft:latest@sha256:3224ea61bd102010476d4e8512898cb8288baad2a7329dd1863028b5c49cd69c
    container_name: photocraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32121:3001
      - 32120:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: PhotoCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/photocraft/icon.png
      homepage.description: Layered photo editor in the browser
      glance.name: PhotoCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/photocraft/icon.png
      glance.description: Layered photo editor in the browser
x-casaos:
  id: com.junkerderprovinz.photocraft
  main: photocraft
  index: /
  port_map: '32121'
  scheme: https
  title:
    en_US: PhotoCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.photocraft/assets/icon.png
  version: 1.1.2

name: arrowloop
services:
  arrowloop:
    image: junkerderprovinz/arrowloop:latest@sha256:b664bc6807d26afc8022aaac36426f5527fe27d8da4b0db2a508fb5b4e0e0a28
    container_name: arrowloop
    restart: unless-stopped
    hostname: arrowloop
    ports:
      - 8422:8422
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/data
    environment:
      TZ: $TZ
      ARROWLOOP_ADDR: 0.0.0.0:8422
      ARROWLOOP_UMASK: '000'
x-casaos:
  id: com.junkerderprovinz.arrowloop
  main: arrowloop
  index: /
  port_map: '8422'
  scheme: http
  title:
    en_US: ArrowLoop
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.arrowloop/assets/icon.png
  version: 2.6.9

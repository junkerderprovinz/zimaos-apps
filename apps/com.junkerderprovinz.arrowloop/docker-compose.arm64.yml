name: arrowloop
services:
  arrowloop:
    image: junkerderprovinz/arrowloop:latest@sha256:69a46b6a67f47c5ca70858e007cf43d891bbe7d2256139572a78175791320e3f
    container_name: arrowloop
    restart: unless-stopped
    hostname: arrowloop
    ports:
      - 8422:8422
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/data
    environment:
      TZ: $TZ
      ARROWLOOP_ADDR: 0.0.0.0:8422
      ARROWLOOP_UMASK: '000'
x-casaos:
  id: com.junkerderprovinz.arrowloop
  main: arrowloop
  index: /
  port_map: '8422'
  scheme: http
  title:
    en_US: ArrowLoop
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.arrowloop/assets/icon.png
  version: 2.2.8

name: pocket-id-jdp
services:
  pocket-id:
    image: pocketid/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    ports:
      - 1411:1411
    volumes:
      - /DATA/AppData/$AppID:/app/data
    environment:
      APP_URL: https://id.example.com
      ENCRYPTION_KEY: ''
      TRUST_PROXY: 'false'
      PUID: $PUID
      PGID: $PGID
      CLOUDFLARE_LOCATION_HEADERS: 'false'
      AUDIT_LOG_RETENTION_DAYS: '90'
      UI_CONFIG_DISABLED: 'false'
      ANALYTICS_DISABLED: 'false'
      VERSION_CHECK_DISABLED: 'false'
      LOG_LEVEL: info
    labels:
      homepage.href: ''
      homepage.group: Security
      homepage.name: Pocket ID
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/pocket-id/icon.png
      homepage.description: Passkey login for your apps
      glance.name: Pocket ID
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/pocket-id/icon.png
      glance.description: Passkey login for your apps
x-casaos:
  id: com.junkerderprovinz.pocket-id
  main: pocket-id
  index: /
  port_map: '1411'
  scheme: http
  title:
    en_US: Pocket-ID
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.pocket-id/assets/icon.png
  version: 2.19.3

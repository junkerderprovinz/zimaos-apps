name: jdownloader
services:
  jdownloader:
    image: junkerderprovinz/jdownloader:latest@sha256:a5d858c8934c4b1df5b59ff89de15d255096932083a9f47833a47c2d120b066d
    container_name: jdownloader
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32080:3000
      - 32081:3001
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA/Downloads:/downloads
    environment:
      JD_THEME: jd-highlighter-dark
      JD_SELFUPDATE: 'true'
      JD_ENABLE_BROWSER: auto
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.jdownloader
  main: jdownloader
  index: /
  port_map: '32081'
  scheme: https
  title:
    en_US: JDownloader
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.jdownloader/assets/icon.png
  version: 4.9.4

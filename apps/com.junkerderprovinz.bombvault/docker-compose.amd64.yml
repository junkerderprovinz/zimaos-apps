name: bombvault
services:
  bombvault:
    image: junkerderprovinz/bombvault:latest@sha256:4da87b06aa798b99b9489749eaadea58ed576dd33cb58263f0280d56358c6fd3
    container_name: bombvault
    restart: unless-stopped
    hostname: bombvault
    ports:
      - 3443:3443
      - 3000:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/host/user
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HTTP_ONLY: 'false'
      APP_KEY: ''
      HOST_SOURCE_ROOT: /DATA
      LIBVIRT_HOST: 192.168.x.x
      LIBVIRT_SSH_PORT: '22'
      LIBVIRT_SSH_USER: root
      PLATFORM: generic
      DATA_ROOT_SEGMENTS: AppData
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: BombVault
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/bombvault/main/.github/assets/icon.png?v=6
      homepage.description: Backup and disaster recovery for containers and VMs
      glance.name: BombVault
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/bombvault/main/.github/assets/icon.png?v=6
      glance.description: Backup and disaster recovery for containers and VMs
    extra_hosts:
      - host.docker.internal:host-gateway
x-casaos:
  id: com.junkerderprovinz.bombvault
  main: bombvault
  index: /
  port_map: '3443'
  scheme: https
  title:
    en_US: BombVault
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.bombvault/assets/icon.png
  version: 10.6.3

name: effectcraft
services:
  effectcraft:
    image: junkerderprovinz/effectcraft:latest@sha256:6f8f370aa8ec68c9c8327bc57730efd8f7c18bcc3a456b419070f74178cbc202
    container_name: effectcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32031:3001
      - 32030:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: EffectCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/effectcraft/icon.png
      homepage.description: Motion graphics with keyframes and effects
      glance.name: EffectCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/effectcraft/icon.png
      glance.description: Motion graphics with keyframes and effects
x-casaos:
  id: com.junkerderprovinz.effectcraft
  main: effectcraft
  index: /
  port_map: '32031'
  scheme: https
  title:
    en_US: EffectCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.effectcraft/assets/icon.png
  version: 1.1.2

name: figcraft
services:
  figcraft:
    image: junkerderprovinz/figcraft:latest@sha256:34d0d237754f9c02ec2cdcf22ffc22c0f1aef03c64138882f61ca725ea02c076
    container_name: figcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32041:3001
      - 32040:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.figcraft
  main: figcraft
  index: /
  port_map: '32041'
  scheme: https
  title:
    en_US: FigCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.figcraft/assets/icon.png
  version: 1.1.2

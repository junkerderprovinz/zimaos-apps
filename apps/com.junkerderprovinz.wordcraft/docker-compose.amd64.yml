name: wordcraft
services:
  wordcraft:
    image: junkerderprovinz/wordcraft:latest@sha256:b9c5daa6c0d6bd0fd11b9e4fcfbcc1850c7467f64b75e8f05ff2e97af21e27c8
    container_name: wordcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32171:3001
      - 32170:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.wordcraft
  main: wordcraft
  index: /
  port_map: '32171'
  scheme: https
  title:
    en_US: WordCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.wordcraft/assets/icon.png
  version: 1.1.2

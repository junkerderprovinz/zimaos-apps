name: versitygw
services:
  versitygw:
    image: versity/versitygw:latest
    container_name: versitygw
    restart: unless-stopped
    ports:
      - 7070:7070
      - 7071:7071
      - 7080:7080
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID:/config
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      ROOT_ACCESS_KEY: admin
      ROOT_SECRET_KEY: casaos
      VGW_PORT: :7070
      VGW_WEBUI_PORT: :7071
      VGW_ADMIN_PORT: :7080
      VGW_WEBUI_NO_TLS: 'true'
      VGW_IAM_DIR: /config
      VGW_REGION: us-east-1
      VGW_HEALTH: /_health
      VGW_DISABLE_OTMP: 'false'
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: VersityGW
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/versitygw/icon.png
      homepage.description: S3 API in front of an existing share
      glance.name: VersityGW
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/versitygw/icon.png
      glance.description: S3 API in front of an existing share
x-casaos:
  id: com.junkerderprovinz.versitygw
  main: versitygw
  index: /
  port_map: '7071'
  scheme: http
  title:
    en_US: VersityGW
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.versitygw/assets/icon.png
  version: 1.11.0

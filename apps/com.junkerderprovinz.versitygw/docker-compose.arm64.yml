name: versitygw
services:
  versitygw:
    image: versity/versitygw:latest@sha256:cd5ba0ae16274974099e95b34bb93b5f5f5a45f97e9a8a6b44fe22b349074cd6
    container_name: versitygw
    restart: unless-stopped
    ports:
      - 7070:7070
      - 7071:7071
      - 7080:7080
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID:/config
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      ROOT_ACCESS_KEY: admin
      ROOT_SECRET_KEY: casaos
      VGW_PORT: :7070
      VGW_WEBUI_PORT: :7071
      VGW_ADMIN_PORT: :7080
      VGW_WEBUI_NO_TLS: 'true'
      VGW_IAM_DIR: /config
      VGW_REGION: us-east-1
      VGW_HEALTH: /_health
x-casaos:
  id: com.junkerderprovinz.versitygw
  main: versitygw
  index: /
  port_map: '7071'
  scheme: http
  title:
    en_US: VersityGW
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.versitygw/assets/icon.png
  version: 1.10.0

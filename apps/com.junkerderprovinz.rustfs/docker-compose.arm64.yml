name: rustfs
services:
  rustfs:
    image: rustfs/rustfs:latest@sha256:cbe0f3db10595b7b5a9020f80b31430e9d92f69db7914e2d11fc5c14add0c25d
    container_name: rustfs
    restart: unless-stopped
    user: 0:0
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /DATA/AppData/$AppID/data:/data
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: casaos
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_OBS_LOGGER_LEVEL: warn
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: RustFS
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/rustfs/icon.png
      homepage.description: S3 object store written in Rust
      glance.name: RustFS
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/rustfs/icon.png
      glance.description: S3 object store written in Rust
x-casaos:
  id: com.junkerderprovinz.rustfs
  main: rustfs
  index: /
  port_map: '9001'
  scheme: http
  title:
    en_US: RustFS
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.rustfs/assets/icon.png
  version: 1.0.7

name: rustfs
services:
  rustfs:
    image: rustfs/rustfs:latest@sha256:6be0def183a9ec8c05147594ac71c030648fcb0a4b79f29f74cebd1d128ba17a
    container_name: rustfs
    restart: unless-stopped
    user: 0:0
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /DATA/AppData/$AppID/data:/data
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: casaos
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_OBS_LOGGER_LEVEL: warn
x-casaos:
  id: com.junkerderprovinz.rustfs
  main: rustfs
  index: /
  port_map: '9001'
  scheme: http
  title:
    en_US: RustFS
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.rustfs/assets/icon.png
  version: 1.0.4

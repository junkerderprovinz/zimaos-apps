name: excalidraw-jdp
services:
  excalidraw:
    image: junkerderprovinz/excalidraw:latest@sha256:f096f385b327206a650960d3f6de268db2227e618e7de810224f75d2e88bd51a
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - 8443:443
      - 8080:80
    volumes:
      - /DATA/AppData/$AppID:/config
    environment:
      ENABLE_LIBRARY: 'false'
      ENABLE_AI: 'false'
      TZ: $TZ
x-casaos:
  id: com.junkerderprovinz.excalidraw
  main: excalidraw
  index: /
  port_map: '8443'
  scheme: https
  title:
    en_US: Excalidraw
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.excalidraw/assets/icon.png
  version: 1.0.1

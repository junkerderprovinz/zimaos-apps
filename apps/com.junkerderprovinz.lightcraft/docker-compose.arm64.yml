name: lightcraft
services:
  lightcraft:
    image: junkerderprovinz/lightcraft:latest@sha256:229cc9dc59f9659b7627054e78893047d0841c4650aeefb45c933dc4410f10b7
    container_name: lightcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32101:3001
      - 32100:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.lightcraft
  main: lightcraft
  index: /
  port_map: '32101'
  scheme: https
  title:
    en_US: LightCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.lightcraft/assets/icon.png
  version: 1.1.0

name: lightcraft
services:
  lightcraft:
    image: junkerderprovinz/lightcraft:latest@sha256:128334e47f345458b29f5d27fc4906729fe2f528d38120237c8ccde1439cc401
    container_name: lightcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32101:3001
      - 32100:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.lightcraft
  main: lightcraft
  index: /
  port_map: '32101'
  scheme: https
  title:
    en_US: LightCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.lightcraft/assets/icon.png
  version: 1.1.2

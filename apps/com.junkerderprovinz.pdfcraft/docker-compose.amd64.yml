name: pdfcraft
services:
  pdfcraft:
    image: junkerderprovinz/pdfcraft:latest@sha256:d32d44fa50b6a4c3502e9fbd2176dc13fa0e4495e1aa91279dca93b5f64c7fde
    container_name: pdfcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32111:3001
      - 32110:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.pdfcraft
  main: pdfcraft
  index: /
  port_map: '32111'
  scheme: https
  title:
    en_US: PdfCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.pdfcraft/assets/icon.png
  version: 1.1.0

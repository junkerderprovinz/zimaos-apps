name: krusader
services:
  krusader:
    image: junkerderprovinz/krusader:latest@sha256:57662104c1aec8549ae369e8332264b1f3ce14f6f0bf4bad383f830cf29a45d4
    container_name: krusader
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32091:3001
      - 32090:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      KRUSADER_LANG: de = Deutsch
      KRUSADER_THEME: dark
      KEYBOARD_LAYOUT: us
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Tools
      homepage.name: Krusader
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/krusader/icon.png
      homepage.description: Twin-pane file manager on a web desktop
      glance.name: Krusader
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/krusader/icon.png
      glance.description: Twin-pane file manager on a web desktop
x-casaos:
  id: com.junkerderprovinz.krusader
  main: krusader
  index: /
  port_map: '32091'
  scheme: https
  title:
    en_US: Krusader
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.krusader/assets/icon.png
  version: 2.6.3

name: krusader
services:
  krusader:
    image: junkerderprovinz/krusader:latest@sha256:2da3677e8bbd0e606e16e9508a44ff2ff344edb28da7212ab09c17b0e8b2f87e
    container_name: krusader
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32091:3001
      - 32090:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      KRUSADER_LANG: de = Deutsch
      KRUSADER_THEME: dark
      KEYBOARD_LAYOUT: us
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.krusader
  main: krusader
  index: /
  port_map: '32091'
  scheme: https
  title:
    en_US: Krusader
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.krusader/assets/icon.png
  version: 2.6.3

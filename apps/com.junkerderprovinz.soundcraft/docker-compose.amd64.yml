name: soundcraft
services:
  soundcraft:
    image: junkerderprovinz/soundcraft:latest@sha256:749be25bd46817314a7be9933a641d5119b43625973f0954add33c2692fafe8c
    container_name: soundcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32141:3001
      - 32140:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: SoundCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/soundcraft/icon.png
      homepage.description: Multitrack audio workstation
      glance.name: SoundCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/soundcraft/icon.png
      glance.description: Multitrack audio workstation
x-casaos:
  id: com.junkerderprovinz.soundcraft
  main: soundcraft
  index: /
  port_map: '32141'
  scheme: https
  title:
    en_US: SoundCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.soundcraft/assets/icon.png
  version: 1.1.2

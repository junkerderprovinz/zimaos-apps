name: couchdb
services:
  couchdb:
    image: couchdb:latest@sha256:b7e093419252f0bb3ef41afcacfcf1e0cc7e8d0854871d7545ff57191c906689
    container_name: couchdb
    restart: unless-stopped
    ports:
      - 5984:5984
    volumes:
      - /DATA/AppData/$AppID/data:/opt/couchdb/data
      - /DATA/AppData/$AppID/local.d:/opt/couchdb/etc/local.d
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: casaos
x-casaos:
  id: com.junkerderprovinz.couchdb
  main: couchdb
  index: /_utils/
  port_map: '5984'
  scheme: http
  title:
    en_US: couchdb
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.couchdb/assets/icon.png
  version: 3.5.3

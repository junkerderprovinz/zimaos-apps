name: couchdb
services:
  couchdb:
    image: couchdb:latest@sha256:c0aacf2750f51cb7749472aa3be8acab3430b040494691fc81a786563d99921a
    container_name: couchdb
    restart: unless-stopped
    ports:
      - 5984:5984
    volumes:
      - /DATA/AppData/$AppID/data:/opt/couchdb/data
      - /DATA/AppData/$AppID/local.d:/opt/couchdb/etc/local.d
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: casaos
x-casaos:
  id: com.junkerderprovinz.couchdb
  main: couchdb
  index: /_utils/
  port_map: '5984'
  scheme: http
  title:
    en_US: couchdb
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.couchdb/assets/icon.png
  version: 3.5.3

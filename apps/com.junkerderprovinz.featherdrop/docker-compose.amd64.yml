name: featherdrop
services:
  featherdrop:
    image: junkerderprovinz/featherdrop:latest@sha256:9587b1ce1f9fe762758b6752809f89bef78ed02f140a2881e66ffb94a8c2b245
    container_name: featherdrop
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID/config:/config
    environment:
      CONFIG_DIR: /config
      DEFAULT_EXPIRY: 7d
      MAX_FILE_SIZE: '0'
      MAX_EXPIRY: never
      STORAGE_QUOTA: '0'
      RATE_LIMIT: 'true'
      TRUST_PROXY: 'false'
x-casaos:
  id: com.junkerderprovinz.featherdrop
  main: featherdrop
  index: /
  port_map: '3000'
  scheme: http
  title:
    en_US: featherdrop
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.featherdrop/assets/icon.png
  version: 6.1.0

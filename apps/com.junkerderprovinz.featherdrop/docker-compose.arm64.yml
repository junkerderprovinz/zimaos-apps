name: featherdrop
services:
  featherdrop:
    image: junkerderprovinz/featherdrop:latest@sha256:b040297e25fb3377cd253e4a1351d6134e4129a333a0039f765b9b0fa09f7b6b
    container_name: featherdrop
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID/config:/config
    environment:
      CONFIG_DIR: /config
      DEFAULT_EXPIRY: 7d
      MAX_FILE_SIZE: '0'
      MAX_EXPIRY: never
      STORAGE_QUOTA: '0'
      RATE_LIMIT: 'true'
      TRUST_PROXY: 'false'
x-casaos:
  id: com.junkerderprovinz.featherdrop
  main: featherdrop
  index: /
  port_map: '3000'
  scheme: http
  title:
    en_US: featherdrop
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.featherdrop/assets/icon.png
  version: 6.1.0

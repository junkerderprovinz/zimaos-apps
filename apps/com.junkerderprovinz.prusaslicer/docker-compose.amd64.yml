name: prusaslicer
services:
  prusaslicer:
    image: junkerderprovinz/prusaslicer:latest@sha256:a788f36c01b5e27826b05b5cc563f7cf50c4e683316a6a113a7318ba76a635f2
    container_name: prusaslicer
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32131:3001
      - 32130:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.prusaslicer
  main: prusaslicer
  index: /
  port_map: '32131'
  scheme: https
  title:
    en_US: PrusaSlicer
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.prusaslicer/assets/icon.png
  version: 1.2.0

name: standardnotes-webui
services:
  standardnotes-webui:
    image: standardnotes/web:latest
    container_name: standardnotes-webui
    restart: unless-stopped
    ports:
      - 3001:80
x-casaos:
  id: com.junkerderprovinz.standardnotes-webui
  main: standardnotes-webui
  index: /
  port_map: '3001'
  scheme: http
  title:
    en_US: StandardNotes-WebUI
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.standardnotes-webui/assets/icon.png
  version: 2026.10.30

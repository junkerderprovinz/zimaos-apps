name: gridcraft
services:
  gridcraft:
    image: junkerderprovinz/gridcraft:latest@sha256:34b471adca6c783abd4a78db4ef7905beb7826fb81754de0a9e0e611d970db46
    container_name: gridcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32061:3001
      - 32060:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.gridcraft
  main: gridcraft
  index: /
  port_map: '32061'
  scheme: https
  title:
    en_US: GridCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.gridcraft/assets/icon.png
  version: 1.1.2

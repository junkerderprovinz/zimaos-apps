name: securo
services:
  securo:
    image: junkerderprovinz/securo:latest@sha256:d80cdce3a15d1182b50ad414c89e043ebaf0ca4076eb129d78472b5bc5827412
    container_name: securo
    restart: unless-stopped
    ports:
      - 3000:8080
    volumes:
      - /DATA/AppData/$AppID:/data
    environment:
      BUILTIN_POSTGRES: 'true'
      POSTGRES_USER: postgres
      BUILTIN_REDIS: 'true'
      REGISTRATION_ENABLED: 'true'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: securo
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      TRUSTED_PROXY_HOPS: '1'
      SIMPLEFIN_ENABLED: 'false'
      SIMPLEFIN_API_URL: https://beta-bridge.simplefin.org
      OIDC_ENABLED: 'false'
      OIDC_PROVIDER_NAME: OIDC
      LOCAL_AUTH_ENABLED: 'true'
      PUID: $PUID
      PGID: $PGID
x-casaos:
  id: com.junkerderprovinz.securo
  main: securo
  index: /
  port_map: '3000'
  scheme: http
  title:
    en_US: Securo
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.securo/assets/icon.png
  version: 1.0.2

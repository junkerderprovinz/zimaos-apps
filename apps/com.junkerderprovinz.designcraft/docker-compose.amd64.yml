      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.designcraft
  main: designcraft
  index: /
  port_map: '32021'
  scheme: https
  title:
    en_US: DesignCraft
  icon: https://junkerderprovinz.github.io/zimaos-apps/apps/com.junkerderprovinz.designcraft/assets/icon.png
  version: 1.1.2

name: designcraft
services:
  designcraft:
    image: junkerderprovinz/designcraft:latest@sha256:bc292c474fcfb1bdd7c2496f9e10019dd1dadfd3136150e6ef1e8e2b332d354c
    container_name: designcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - 32021:3001
      - 32020:3000
    volumes:
      - /DATA/AppData/$AppID:/config
      - /DATA:/storage

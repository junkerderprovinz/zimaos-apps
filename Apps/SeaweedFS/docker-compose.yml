name: seaweedfs
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
    - 8333:8333
    - 23646:23646
    - 9333:9333
    - 8888:8888
    volumes:
    - /DATA/AppData/$AppID/data:/data
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: SeaweedFS
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/seaweedfs/icon.png?v=2
      homepage.description: S3-compatible object store
      glance.name: SeaweedFS
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/seaweedfs/icon.png?v=2
      glance.description: S3-compatible object store
x-casaos:
  id: com.junkerderprovinz.seaweedfs
  main: seaweedfs
  index: /
  port_map: '23646'
  scheme: http
  title:
    en_US: SeaweedFS
  tagline:
    en_US: Fast, S3-API-compatible object store on the official image, the actively-maintained alternative now that MinIO's open edition is done.
  description:
    en_US: Fast, S3-API-compatible object store on the official image, the actively-maintained alternative now that MinIO's open edition is done.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/SeaweedFS/icon.png
  category: Others
  author: Junker der Provinz
  developer: Chris Lu
  architectures:
  - '386'
  - amd64
  - arm
  - arm64
  - ppc64le
  - s390x
  version: 4.54.0
  repo: https://github.com/junkerderprovinz/unraid-apps/blob/main/seaweedfs/README.md
  support: https://github.com/junkerderprovinz/unraid-apps/issues

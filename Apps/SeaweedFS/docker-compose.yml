name: seaweedfs
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
    - 8333:8333
    - 23646:23646
    - 9333:9333
    - 8888:8888
    volumes:
    - /DATA/AppData/$AppID/data:/data
x-casaos:
  id: com.junkerderprovinz.seaweedfs
  main: seaweedfs
  index: /
  port_map: '23646'
  scheme: http
  title:
    en_US: SeaweedFS
  tagline:
    en_US: Fast, S3-API-compatible object store on the official image, the actively-maintained alternative now that MinIO's open edition is done.
  description:
    en_US: Fast, S3-API-compatible object store on the official image, the actively-maintained alternative now that MinIO's open edition is done.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/SeaweedFS/icon.png
  category: Others
  author: Junker der Provinz
  developer: Chris Lu
  architectures:
  - '386'
  - amd64
  - arm
  - arm64
  version: 4.48.0
  repo: https://github.com/junkerderprovinz/unraid-apps/blob/main/seaweedfs/README.md
  support: https://github.com/junkerderprovinz/unraid-apps/issues

name: deckcraft
services:
  deckcraft:
    image: junkerderprovinz/deckcraft:latest
    container_name: deckcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 3001:3001
    - 3000:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.deckcraft
  main: deckcraft
  index: /
  port_map: '3001'
  scheme: https
  title:
    en_US: DeckCraft
  tagline:
    en_US: DeckCraft on a Selkies web desktop, for building and presenting PowerPoint decks from any browser.
  description:
    en_US: DeckCraft, presentations that open and save PowerPoint .pptx decks, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/DeckCraft/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

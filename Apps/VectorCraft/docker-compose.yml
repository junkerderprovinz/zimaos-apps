name: vectorcraft
services:
  vectorcraft:
    image: junkerderprovinz/vectorcraft:latest
    container_name: vectorcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 3001:3001
    - 3000:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.vectorcraft
  main: vectorcraft
  index: /
  port_map: '3001'
  scheme: https
  title:
    en_US: VectorCraft
  tagline:
    en_US: 'VectorCraft on a Selkies web desktop: vector illustration with paths and type, SVG and PDF in and out.'
  description:
    en_US: VectorCraft, vector illustration in the spirit of Illustrator, SVG and PDF in and out, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/VectorCraft/icon.png
  category: Media
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

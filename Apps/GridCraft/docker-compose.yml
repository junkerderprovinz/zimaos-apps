name: gridcraft
services:
  gridcraft:
    image: junkerderprovinz/gridcraft:latest
    container_name: gridcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 3001:3001
    - 3000:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.gridcraft
  main: gridcraft
  index: /
  port_map: '3001'
  scheme: https
  title:
    en_US: GridCraft
  tagline:
    en_US: 'GridCraft on a Selkies web desktop: a spreadsheet with formulas and charts that opens and saves Excel workbooks.'
  description:
    en_US: GridCraft, a spreadsheet that opens and saves Excel .xlsx workbooks, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/GridCraft/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

name: jdownloader
services:
  jdownloader:
    image: junkerderprovinz/jdownloader:latest
    container_name: jdownloader
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 3000:3000
    - 3001:3001
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA/Downloads:/downloads
    environment:
      JD_THEME: Dark
      JD_ACCENT: '#ffee00'
      JD_SELFUPDATE: 'true'
      JD_ENABLE_BROWSER: auto
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.jdownloader
  main: jdownloader
  index: /
  port_map: '3001'
  scheme: https
  title:
    en_US: JDownloader
  tagline:
    en_US: JDownloader 2 with a complete, sleek dark UI out of the box, on a fast Selkies web desktop in your browser. No VNC client, no install.
  description:
    en_US: JDownloader 2 with a dark mode GUI and full clipboard support out of the box. The download list, link grabber and settings are all dark, and everything runs on a hardware-accelerated Selkies web desktop. It looks like this from the first start, without tweaking or add-ons.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/JDownloader/icon.png
  category: Media
  author: Junker der Provinz
  developer: AppWork
  architectures:
  - amd64
  - arm64
  version: 4.8.0
  repo: https://github.com/junkerderprovinz/jdownloader
  support: https://github.com/junkerderprovinz/jdownloader/issues

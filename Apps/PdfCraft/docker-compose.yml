name: pdfcraft
services:
  pdfcraft:
    image: junkerderprovinz/pdfcraft:latest
    container_name: pdfcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32111:3001
    - 32110:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.pdfcraft
  main: pdfcraft
  index: /
  port_map: '32111'
  scheme: https
  title:
    en_US: PdfCraft
  tagline:
    en_US: PdfCraft on a Selkies web desktop, for reading, editing, signing and running OCR on PDFs in the browser.
  description:
    en_US: PdfCraft, a PDF reader and editor with forms, annotations and OCR, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/PdfCraft/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

name: cannoncommander
services:
  cannoncommander:
    image: junkerderprovinz/cannoncommander:latest
    container_name: cannoncommander
    restart: unless-stopped
    hostname: cannoncommander
    ports:
    - 8480:80
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/mnt/user
    environment:
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
      TZ: $TZ
      CC_UNRAID_SOCKET: 'false'
    devices:
    - /dev/fuse
    cap_add:
    - SYS_ADMIN
    - DAC_READ_SEARCH
    - DAC_OVERRIDE
    security_opt:
    - apparmor:unconfined
x-casaos:
  id: com.junkerderprovinz.cannoncommander
  main: cannoncommander
  index: /
  port_map: '8480'
  scheme: http
  title:
    en_US: CannonCommander
  tagline:
    en_US: 'The most beautiful file manager you will ever run, and the only one you need: two panels, F5 to copy, jobs in the background and a trash for second thoughts.'
  description:
    en_US: The most beautiful file manager you will ever run. Also the only one you need.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/CannonCommander/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: Junker der Provinz
  architectures:
  - amd64
  - arm64
  version: 1.1.2
  tips:
    before_install:
      en_US: On the first start the container writes a password for the user admin into its log. Sign in with it and pick your own.
  repo: https://github.com/junkerderprovinz/cannoncommander
  support: https://github.com/junkerderprovinz/cannoncommander/issues

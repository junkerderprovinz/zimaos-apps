name: photocraft
services:
  photocraft:
    image: junkerderprovinz/photocraft:latest
    container_name: photocraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32121:3001
    - 32120:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.photocraft
  main: photocraft
  index: /
  port_map: '32121'
  scheme: https
  title:
    en_US: PhotoCraft
  tagline:
    en_US: 'PhotoCraft on a Selkies web desktop: a layered photo editor in the browser that opens PSD, Krita and Affinity files.'
  description:
    en_US: PhotoCraft, a layered photo editor that opens PSD, Krita and Affinity files, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/PhotoCraft/icon.png
  category: Media
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

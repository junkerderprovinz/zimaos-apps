name: handbrake-jdp
services:
  handbrake:
    image: junkerderprovinz/handbrake:latest
    container_name: handbrake
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 3001:3001
    - 3000:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage:ro
    - /DATA/Media/HandBrake/watch:/watch
    - /DATA/Media/HandBrake/output:/output
    environment:
      HANDBRAKE_THEME: dark
      KEYBOARD_LAYOUT: us
      GPU_VENDOR: none
      APP_NICENESS: '0'
      AUTOMATED_CONVERSION: '1'
      AUTOMATED_CONVERSION_PRESET: General/Very Fast 1080p30
      AUTOMATED_CONVERSION_FORMAT: mp4
      AUTOMATED_CONVERSION_KEEP_SOURCE: '1'
      AUTOMATED_CONVERSION_OVERWRITE_OUTPUT: '0'
      AUTOMATED_CONVERSION_SOURCE_STABLE_TIME: '5'
      AUTOMATED_CONVERSION_CHECK_INTERVAL: '5'
      AUTOMATED_CONVERSION_MAX_WATCH_FOLDERS: '5'
      WEB_FILE_MANAGER: '1'
      WEB_FILE_MANAGER_ALLOWED_PATHS: AUTO
      WEB_TERMINAL: '0'
      WEB_TERMINAL_SHELL_PATH: /bin/bash
      WEB_NOTIFICATION: '0'
      ATTACHED_DEVICES_PERMS: /dev/sr*
      INSTALL_LIBDVDCSS: 'false'
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.handbrake
  main: handbrake
  index: /
  port_map: '3001'
  scheme: https
  title:
    en_US: HandBrake
  tagline:
    en_US: HandBrake's full GUI on a fast Selkies web desktop, GPU-accelerated on NVIDIA, Intel and AMD, with a watch folder that converts on its own.
  description:
    en_US: The full HandBrake video transcoder GUI in your browser, running on a hardware-accelerated Selkies web desktop. It is dark by default and uses HandBrake's own native GTK dark mode rather than a repainted theme. Transcoding can run on NVIDIA, Intel and AMD GPUs.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/HandBrake/icon.png
  category: Media
  author: Junker der Provinz
  developer: HandBrake
  architectures:
  - amd64
  - arm64
  version: 1.3.0
  repo: https://github.com/junkerderprovinz/handbrake
  support: https://github.com/junkerderprovinz/handbrake/issues

name: versitygw
services:
  versitygw:
    image: versity/versitygw:latest
    container_name: versitygw
    restart: unless-stopped
    ports:
    - 7070:7070
    - 7071:7071
    - 7080:7080
    volumes:
    - /DATA/AppData/$AppID/data:/data
    - /DATA/AppData/$AppID:/config
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      ROOT_ACCESS_KEY: admin
      ROOT_SECRET_KEY: casaos
      VGW_PORT: :7070
      VGW_WEBUI_PORT: :7071
      VGW_ADMIN_PORT: :7080
      VGW_WEBUI_NO_TLS: 'true'
      VGW_IAM_DIR: /config
      VGW_REGION: us-east-1
      VGW_HEALTH: /_health
x-casaos:
  id: com.junkerderprovinz.versitygw
  main: versitygw
  index: /
  port_map: '7071'
  scheme: http
  title:
    en_US: VersityGW
  tagline:
    en_US: 'An S3 API in front of a share you already have: top-level folders become buckets, and every file stays readable over SMB and NFS at the same time.'
  description:
    en_US: 'Puts an S3 API in front of a folder you already have. Point it at a share and every file in it is an S3 object, readable over S3 and over SMB or NFS at the same time - no import, no second copy, no migration. Unlike an object store such as Garage or SeaweedFS, this one brings no storage of its own: your array stays the storage, and the bucket is a directory.'
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/VersityGW/icon.png
  category: Others
  author: Junker der Provinz
  developer: Versity
  architectures:
  - amd64
  - arm64
  version: 1.9.0
  tips:
    before_install:
      en_US: Starts with ROOT_ACCESS_KEY as admin and ROOT_SECRET_KEY as casaos. Change them under Custom Installation before you store real data.
  repo: https://github.com/junkerderprovinz/unraid-apps/blob/main/versitygw/README.md
  support: https://github.com/junkerderprovinz/unraid-apps/issues

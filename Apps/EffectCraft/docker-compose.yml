name: effectcraft
services:
  effectcraft:
    image: junkerderprovinz/effectcraft:latest
    container_name: effectcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32031:3001
    - 32030:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.effectcraft
  main: effectcraft
  index: /
  port_map: '32031'
  scheme: https
  title:
    en_US: EffectCraft
  tagline:
    en_US: EffectCraft on a Selkies web desktop, for motion graphics with compositions, keyframes and effects in the browser.
  description:
    en_US: EffectCraft, motion graphics and compositing in the spirit of After Effects, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/EffectCraft/icon.png
  category: Media
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

name: lightcraft
services:
  lightcraft:
    image: junkerderprovinz/lightcraft:latest
    container_name: lightcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32101:3001
    - 32100:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.lightcraft
  main: lightcraft
  index: /
  port_map: '32101'
  scheme: https
  title:
    en_US: LightCraft
  tagline:
    en_US: LightCraft on a Selkies web desktop, a photo library and raw developer that sits right next to the photos on your array.
  description:
    en_US: LightCraft, a photo library and raw developer in the spirit of Lightroom, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/LightCraft/icon.png
  category: Media
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

name: krusader
services:
  krusader:
    image: junkerderprovinz/krusader:latest
    container_name: krusader
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32091:3001
    - 32090:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      KRUSADER_LANG: de = Deutsch
      KRUSADER_THEME: dark
      KEYBOARD_LAYOUT: us
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.krusader
  main: krusader
  index: /
  port_map: '32091'
  scheme: https
  title:
    en_US: Krusader
  tagline:
    en_US: Twin-pane KDE file manager with a native dark theme on a fast Selkies web desktop, with Kate, krename and RAR built in.
  description:
    en_US: Krusader file manager with native Dark Mode, running on a hardware-accelerated Selkies web desktop. It responds much faster than the noVNC-based Krusader containers (binhex / jlesage / ich777).
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/Krusader/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: KDE
  architectures:
  - amd64
  - arm64
  version: 2.6.1
  repo: https://github.com/junkerderprovinz/krusader
  support: https://github.com/junkerderprovinz/krusader/issues

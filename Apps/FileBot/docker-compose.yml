name: filebot
services:
  filebot:
    image: junkerderprovinz/filebot:latest
    container_name: filebot
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32181:3001
    - 32180:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
      FILEBOT_THEME: Darcula
      AMC_ENABLED: '0'
      AMC_INPUT_DIR: /watch
      AMC_OUTPUT_DIR: /output
      AMC_ACTION: test
      AMC_CONFLICT: auto
      AMC_MATCH_MODE: opportunistic
      AMC_LANG: English
      AMC_INTERVAL: '1800'
      AMC_INPUT_STABLE_TIME: '10'
      AMC_PROCESS_MUSIC: y
      AMC_ARTWORK: n
x-casaos:
  id: com.junkerderprovinz.filebot
  main: filebot
  index: /
  port_map: '32181'
  scheme: https
  title:
    en_US: FileBot
  tagline:
    en_US: The FileBot media renamer in your browser on a fast Selkies web desktop, dark from the first start. Bring your own FileBot license.
  description:
    en_US: FileBot, the renamer for movies, shows, anime and music, on a Selkies web desktop. The full FileBot desktop app runs in the container and streams to your browser as H.264 video, so you need no VNC client and no local install. Built for amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/FileBot/icon.png
  category: Media
  author: Junker der Provinz
  developer: Reinhard Pointner
  architectures:
  - amd64
  - arm64
  version: 1.0.2
  repo: https://github.com/junkerderprovinz/filebot
  support: https://github.com/junkerderprovinz/filebot/issues

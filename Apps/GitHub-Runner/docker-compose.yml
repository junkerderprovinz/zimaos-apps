name: github-runner
services:
  github-runner:
    image: junkerderprovinz/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
    - 8080:8080
    volumes:
    - /DATA/AppData/$AppID:/config
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      RUNNER_NAME: GitHub-Runner
      LABELS: self-hosted
      NO_DEFAULT_LABELS: 'false'
      RUN_AS_ROOT: 'true'
      DEREGISTER_ON_STOP: 'true'
      RETRY_SECONDS: '300'
    labels:
      homepage.group: Tools
      homepage.name: GitHub-Runner
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/github-runner/icon.png
      homepage.description: GitHub Actions runners for several repositories
      glance.name: GitHub-Runner
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/github-runner/icon.png
      glance.description: GitHub Actions runners for several repositories
x-casaos:
  id: com.junkerderprovinz.github-runner
  main: github-runner
  index: /
  port_map: '8080'
  scheme: http
  title:
    en_US: GitHub-Runner
  tagline:
    en_US: Self-hosted GitHub Actions runners for several repositories of a personal account in one container, removed from GitHub again when it stops.
  description:
    en_US: Self-hosted GitHub Actions runners for several repositories in one container.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/GitHub-Runner/icon.png
  category: Developer
  author: Junker der Provinz
  developer: Junker der Provinz
  architectures:
  - amd64
  - arm64
  version: 1.0.1
  repo: https://github.com/junkerderprovinz/github-runner
  support: https://github.com/junkerderprovinz/github-runner/issues

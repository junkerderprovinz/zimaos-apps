name: designcraft
services:
  designcraft:
    image: junkerderprovinz/designcraft:latest
    container_name: designcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32021:3001
    - 32020:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.designcraft
  main: designcraft
  index: /
  port_map: '32021'
  scheme: https
  title:
    en_US: DesignCraft
  tagline:
    en_US: 'DesignCraft on a Selkies web desktop: lay out magazines and flyers in the browser and export print-ready PDFs.'
  description:
    en_US: DesignCraft, page layout and publishing for print and PDF, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/DesignCraft/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues

name: wordcraft
services:
  wordcraft:
    image: junkerderprovinz/wordcraft:latest
    container_name: wordcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
    - 32171:3001
    - 32170:3000
    volumes:
    - /DATA/AppData/$AppID:/config
    - /DATA:/storage
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: '022'
x-casaos:
  id: com.junkerderprovinz.wordcraft
  main: wordcraft
  index: /
  port_map: '32171'
  scheme: https
  title:
    en_US: WordCraft
  tagline:
    en_US: WordCraft on a Selkies web desktop, a word processor in the browser that opens and saves Word documents.
  description:
    en_US: WordCraft, a word processor that opens and saves Word .docx documents, on a Selkies web desktop. It runs in your browser without a VNC client or a local install, on amd64 and arm64.
  icon: https://cdn.jsdelivr.net/gh/junkerderprovinz/zimaos-apps@main/Apps/WordCraft/icon.png
  category: Productivity
  author: Junker der Provinz
  developer: ArtCraft team
  architectures:
  - amd64
  - arm64
  version: 1.1.0
  repo: https://github.com/junkerderprovinz/artcraft-apps
  support: https://github.com/junkerderprovinz/artcraft-apps/issues
